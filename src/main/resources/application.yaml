spring:
  application:
    name: visittracker

  mvc:
    # Render every error - framework and application alike - as an RFC 9457 problem detail.
    problemdetails:
      enabled: true

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:visittracker}?connectionTimeZone=UTC&rewriteBatchedStatements=true
    username: ${DB_USER:visittracker}
    password: ${DB_PASSWORD:visittracker}

  jpa:
    # Lazy associations must not be resolved during response rendering.
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks the mapping matches it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 500
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
